name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: tests (deterministic simulation, Porcupine, planted bugs)
        run: go test -count=1 -timeout 15m ./...
      - name: 200 seeds of the correct system
        run: go run ./cmd/raftkv-sim -seeds 200
